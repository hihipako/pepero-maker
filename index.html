<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>빼빼로 메이커</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* Layout: gift preview on a stage at left (top on phones), a tabbed workbench of controls at right. */
:root{
  --bg:#FBF0EE; --panel:#FFFFFF; --ink:#3A2118; --muted:#87675D; --line:#EBD6D0;
  --accent:#D63A60; --accent-ink:#FFFFFF; --stage:#F4E1DC; --chip:#FBF4F2;
  --display:'Gaegu','Gowun Dodum',cursive; --body:'Gowun Dodum',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1C1311; --panel:#271B18; --ink:#F6E8E3; --muted:#B9978D; --line:#40302A;
  --accent:#FF7094; --accent-ink:#2A0D16; --stage:#2F221E; --chip:#31231F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1311; --panel:#271B18; --ink:#F6E8E3; --muted:#B9978D; --line:#40302A;
  --accent:#FF7094; --accent-ink:#2A0D16; --stage:#2F221E; --chip:#31231F; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:1100px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{margin-bottom:22px}
.eyebrow{display:inline-block;font-size:13px;letter-spacing:.06em;color:var(--accent);border:1.5px solid var(--accent);border-radius:999px;padding:2px 12px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(40px,7vw,60px);line-height:1;margin:10px 0 8px;text-wrap:balance}
.lede{margin:0;color:var(--muted);max-width:60ch}
.grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.stage-col{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
@media (max-width:820px){.stage-col{position:static}}
.stage{position:relative;background:var(--stage);border-radius:22px;padding:14px;display:flex;justify-content:center}
#cv{display:block;width:min(100%,calc(68vh * 600 / 820));aspect-ratio:600/820;height:auto;border-radius:12px;max-width:100%;
  background:repeating-conic-gradient(#e9e2e0 0 25%,#fff 0 50%) 0 0/20px 20px}
#cv.grab{cursor:grab} #cv.dragging{cursor:grabbing}
.drop-hint{position:absolute;inset:14px;border:3px dashed var(--accent);border-radius:12px;display:grid;place-items:center;
  font-family:var(--display);font-size:28px;color:var(--accent);background:color-mix(in srgb,var(--stage) 80%,transparent)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.btn{font:inherit;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:10px 16px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700;margin-left:auto}
.btn.primary:hover{filter:brightness(1.06)}
.note{min-height:1.5em;margin:8px 2px 0;font-size:13px;color:var(--muted)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.panel{background:var(--panel);border:1.5px solid var(--line);border-radius:22px;overflow:hidden;min-width:0}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1.5px solid var(--line)}
.tab{font:inherit;font-family:var(--display);font-size:21px;font-weight:700;background:none;border:0;color:var(--muted);padding:12px 4px 10px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1.5px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.pane{padding:18px 18px 22px;display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.label{font-size:12.5px;letter-spacing:.05em;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:14px;border:1.5px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0;position:relative}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--panel),0 0 0 4.5px var(--accent);border-color:transparent}
.sw.custom{background:conic-gradient(#f66,#fd5,#6d8,#5af,#b7f,#f66);overflow:hidden;display:block}
.sw.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.picker{display:grid;grid-template-columns:repeat(4,1fr) auto;gap:8px}
.stick-btn{font:inherit;border:1.5px solid var(--line);background:var(--chip);color:var(--ink);border-radius:14px;padding:8px 4px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}
.stick-btn .mini{width:14px;height:46px;border-radius:7px 7px 3px 3px}
.stick-btn[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.all-btn{padding:8px 12px}
.letters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
input[type=text],textarea{font:inherit;width:100%;border:1.5px solid var(--line);background:var(--chip);color:var(--ink);border-radius:10px;padding:8px 10px}
.letters input{text-align:center;font-family:var(--display);font-size:22px;font-weight:700;padding:4px}
textarea{resize:vertical;min-height:70px;font-family:var(--display);font-size:19px;line-height:1.3}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=range]{width:100%;accent-color:var(--accent)}
.switch{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px}
.switch input{accent-color:var(--accent);width:18px;height:18px}
.upload{border:2px dashed var(--line);border-radius:16px;padding:22px 16px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.upload p{margin:0;color:var(--muted);font-size:13.5px}
.hint{font-size:13px;color:var(--muted);margin:0}
.sep{height:1.5px;background:var(--line);margin:2px 0}

.sheet{position:fixed;inset:0;background:rgba(20,10,8,.6);display:grid;place-items:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-card{background:var(--panel);border-radius:20px;padding:18px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto}
.sheet-card img{border-radius:12px;width:100%;height:auto}
.sheet-card h2{font-family:var(--display);font-size:28px;margin:0}
.sheet-card p{margin:0;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:no-preference){.chip,.sw,.btn,.stick-btn{transition:background .15s,border-color .15s,box-shadow .15s}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <span class="eyebrow" id="dday">11월 11일 빼빼로데이</span>
    <h1>빼빼로 메이커</h1>
    <p class="lede">두툼한 과자 네 개를 하나씩 꾸미고, 봉지와 리본을 고르고, 사진과 카드를 붙여서 선물 이미지로 저장하세요.</p>
  </header>

  <main class="grid">
    <section class="stage-col">
      <div class="stage" id="stage">
        <canvas id="cv" aria-label="꾸민 빼빼로 선물 미리보기"></canvas>
        <div class="drop-hint" id="dropHint" hidden>여기에 사진을 놓으세요</div>
      </div>
      <div class="actions">
        <button class="btn" id="randomBtn" type="button">랜덤으로 꾸미기</button>
        <button class="btn" id="resetBtn" type="button">처음부터</button>
        <button class="btn primary" id="saveBtn" type="button">이미지 저장</button>
      </div>
      <p class="note" id="note" role="status"></p>
    </section>

    <section class="panel">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tab-snack" aria-selected="true" aria-controls="pane-snack" type="button">과자</button>
        <button class="tab" role="tab" id="tab-wrap" aria-selected="false" aria-controls="pane-wrap" type="button">포장</button>
        <button class="tab" role="tab" id="tab-card" aria-selected="false" aria-controls="pane-card" type="button">카드</button>
        <button class="tab" role="tab" id="tab-photo" aria-selected="false" aria-controls="pane-photo" type="button">사진</button>
      </div>

      <div class="pane" id="pane-snack" role="tabpanel" aria-labelledby="tab-snack">
        <div class="field">
          <div class="label"><span>꾸밀 과자 고르기</span><span id="selLabel">1번 과자</span></div>
          <div class="picker" id="picker"></div>
        </div>
        <div class="field">
          <div class="label">코팅</div>
          <div class="swatches" data-path="stick.coat" data-opts="coat" data-custom="1"></div>
        </div>
        <div class="field">
          <div class="label">토핑</div>
          <div class="chips" data-path="stick.top" data-opts="top"></div>
        </div>
        <div class="field">
          <div class="label">드리즐</div>
          <div class="chips" data-path="stick.drizzle" data-opts="drizzle"></div>
        </div>
        <div class="field">
          <div class="label">비스킷</div>
          <div class="chips" data-path="stick.biscuit" data-opts="biscuit"></div>
        </div>
        <div class="sep"></div>
        <div class="field">
          <div class="label"><span>글자 새기기</span><span>과자마다 1~2글자</span></div>
          <div class="letters">
            <input type="text" id="letter0" data-letter="0" maxlength="2" aria-label="1번 과자 글자">
            <input type="text" id="letter1" data-letter="1" maxlength="2" aria-label="2번 과자 글자">
            <input type="text" id="letter2" data-letter="2" maxlength="2" aria-label="3번 과자 글자">
            <input type="text" id="letter3" data-letter="3" maxlength="2" aria-label="4번 과자 글자">
          </div>
        </div>
        <div class="field">
          <div class="label">글자 색</div>
          <div class="chips" data-path="letter.color" data-opts="letterColor"></div>
        </div>
      </div>

      <div class="pane" id="pane-wrap" role="tabpanel" aria-labelledby="tab-wrap" hidden>
        <div class="field">
          <div class="label">봉지 색</div>
          <div class="chips" data-path="bag.tint" data-opts="tint"></div>
        </div>
        <div class="field">
          <div class="label">봉지 무늬</div>
          <div class="chips" data-path="bag.pattern" data-opts="pattern"></div>
        </div>
        <div class="sep"></div>
        <div class="field">
          <div class="label">리본 모양</div>
          <div class="chips" data-path="ribbon.style" data-opts="rstyle"></div>
        </div>
        <div class="field">
          <div class="label">리본 색</div>
          <div class="swatches" data-path="ribbon.color" data-opts="rcolor" data-custom="1"></div>
        </div>
        <div class="sep"></div>
        <div class="field">
          <div class="label">배경</div>
          <div class="chips" data-path="bg.kind" data-opts="bg"></div>
        </div>
        <label class="switch"><input type="checkbox" id="stampToggle"> 'HAPPY 11.11' 도장 찍기</label>
      </div>

      <div class="pane" id="pane-card" role="tabpanel" aria-labelledby="tab-card" hidden>
        <label class="switch"><input type="checkbox" id="tagToggle"> 리본에 카드 달기</label>
        <div class="row2">
          <div class="field"><label class="label" for="tagTo">받는 사람</label><input type="text" id="tagTo" data-path="tag.to" maxlength="10"></div>
          <div class="field"><label class="label" for="tagFrom">보내는 사람</label><input type="text" id="tagFrom" data-path="tag.from" maxlength="10"></div>
        </div>
        <div class="field">
          <label class="label" for="tagMsg"><span>메시지</span><span>4줄까지 보여요</span></label>
          <textarea id="tagMsg" data-path="tag.msg" maxlength="48"></textarea>
        </div>
        <div class="field">
          <div class="label">카드 색</div>
          <div class="swatches" data-path="tag.color" data-opts="tagColor"></div>
        </div>
      </div>

      <div class="pane" id="pane-photo" role="tabpanel" aria-labelledby="tab-photo" hidden>
        <div class="upload" id="uploadBox">
          <label class="btn" for="fileIn">사진 고르기</label>
          <input type="file" id="fileIn" accept="image/*" hidden>
          <p>미리보기에 사진을 끌어다 놓아도 돼요.</p>
        </div>
        <div id="photoCtrls" class="pane" style="padding:0">
          <p class="hint">미리보기에서 사진을 끌어서 자리를 옮길 수 있어요.</p>
          <div class="field">
            <div class="label">모양</div>
            <div class="chips" data-path="photo.frame" data-opts="frame"></div>
          </div>
          <div class="field">
            <label class="label" for="photoSize">크기</label>
            <input type="range" id="photoSize" data-path="photo.size" min="80" max="300" step="2">
          </div>
          <div class="field">
            <label class="label" for="photoRot">기울기</label>
            <input type="range" id="photoRot" data-path="photo.rot" min="-25" max="25" step="1">
          </div>
          <div class="field">
            <label class="label" for="photoCap">폴라로이드 글씨</label>
            <input type="text" id="photoCap" data-path="photo.caption" maxlength="14">
          </div>
          <button class="btn" id="photoDel" type="button">사진 빼기</button>
        </div>
      </div>
    </section>
  </main>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-card">
    <h2>완성!</h2>
    <p>이 화면에서는 바로 저장할 수 없어요. 아래 이미지를 길게 누르거나 오른쪽 클릭해서 저장하세요.</p>
    <img id="sheetImg" alt="완성된 빼빼로 선물 이미지">
    <button class="btn" id="sheetClose" type="button">닫기</button>
  </div>
</div>

<script>
const W = 600, H = 820;

const COATS = [
  ['#7B4A2E','밀크초코'],['#4A2A1C','다크초코'],['#F49AB0','딸기'],['#F6EEE3','화이트'],
  ['#9DBB6E','말차'],['#F5D76E','바나나'],['#8E7CC3','블루베리'],['#9FE0CF','민트']
];
const TINTS = {
  clear:{name:'투명', rgb:[255,255,255], a:.16, pat:'#FF6F91'},
  pink:{name:'핑크', rgb:[255,165,192], a:.32, pat:'#FFFFFF'},
  sky:{name:'하늘', rgb:[150,205,245], a:.32, pat:'#FFFFFF'},
  lemon:{name:'레몬', rgb:[255,228,130], a:.32, pat:'#FF7E9D'},
  lilac:{name:'라벤더', rgb:[195,175,240], a:.32, pat:'#FFFFFF'},
  red:{name:'레드', rgb:[220,45,70], a:.36, pat:'#FFFFFF'}
};
const BISC = {plain:'#E0AE6A', choco:'#6B4127'};
const DRIZ = {white:'#FFF8EE', dark:'#3B2016', pink:'#FF8FB0'};
const BGS = {
  check:{base:'#FCE4EA', stamp:'#D63A60'}, cream:{base:'#FBF3E6', stamp:'#7B4A2E'},
  sky:{base:'#DDEEFA', stamp:'#3A6AA3'}, choco:{base:'#4A2E24', stamp:'#FFC2D1'}, none:{base:null, stamp:'#D63A60'}
};
const OPTS = {
  coat: COATS,
  top: [['none','없음'],['almond','아몬드'],['sprinkle','무지개 스프링클'],['cookie','쿠키 크럼블'],['heart','하트'],['star','별'],['coconut','코코넛']],
  drizzle: [['none','없음'],['white','화이트'],['dark','초코'],['pink','핑크']],
  biscuit: [['plain','기본'],['choco','초코']],
  letterColor: [['auto','자동'],['#FFF7EE','화이트'],['#4A2A1C','초코'],['#E2466B','핑크'],['#F2B93B','골드']],
  tint: Object.entries(TINTS).map(([k,v]) => [k, v.name]),
  pattern: [['none','없음'],['dots','도트'],['hearts','하트'],['stars','별'],['stripes','줄무늬'],['check','체크']],
  rstyle: [['bow','리본'],['string','끈'],['twist','빵끈']],
  rcolor: [['#D7263D','레드'],['#FF8FAB','핑크'],['#D9A632','골드'],['#24345E','네이비'],['#5CC3A6','민트'],['#FFFFFF','화이트']],
  bg: [['check','핑크 체크'],['cream','크림'],['sky','하늘'],['choco','초코'],['none','투명']],
  tagColor: [['#FFFFFF','화이트'],['#D9B98C','크래프트'],['#FFD6E0','핑크'],['#CDEFE3','민트'],['#C8323F','레드']],
  frame: [['polaroid','폴라로이드'],['heart','하트'],['circle','동그라미']]
};

function defaults(){
  return {
    sticks: [
      {coat:'#7B4A2E', biscuit:'plain', top:'almond',   drizzle:'none', letter:'1'},
      {coat:'#F49AB0', biscuit:'plain', top:'sprinkle', drizzle:'none', letter:'1'},
      {coat:'#F6EEE3', biscuit:'choco', top:'cookie',   drizzle:'none', letter:'1'},
      {coat:'#4A2A1C', biscuit:'plain', top:'none',     drizzle:'pink', letter:'1'}
    ],
    letter: {color:'auto'},
    bag: {tint:'clear', pattern:'hearts'},
    ribbon: {style:'bow', color:'#D7263D'},
    bg: {kind:'check', stamp:true},
    tag: {show:true, to:'너에게', msg:'오늘도 고마워!\n달달한 하루 보내', from:'나', color:'#FFFFFF'},
    photo: null
  };
}

let state = defaults();
let sel = 0;              // selected stick index or 'all'
let photoImg = null;
const STORE = 'pepero-maker-v1';
try {
  const saved = JSON.parse(localStorage.getItem(STORE) || 'null');
  if (saved && saved.sticks && saved.sticks.length === 4) state = Object.assign(defaults(), saved);
} catch (e) {}

/* ---------- helpers ---------- */
function rng(seed){ let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hexRgb(h){ h = h.replace('#',''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function lum(h){ const [r,g,b] = hexRgb(h); return (0.299*r + 0.587*g + 0.114*b) / 255; }
function mix(h, amt){ const [r,g,b] = hexRgb(h); const t = amt < 0 ? 0 : 255, p = Math.abs(amt); return `rgb(${Math.round(r+(t-r)*p)},${Math.round(g+(t-g)*p)},${Math.round(b+(t-b)*p)})`; }
function rgba(c, a){ return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function rr(ctx, x, y, w, h, r){ ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r); ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath(); }
function heart(ctx, cx, cy, size){ const s = size/2; ctx.moveTo(cx, cy+s*0.9); ctx.bezierCurveTo(cx-s*1.6, cy-s*0.2, cx-s*0.7, cy-s*1.4, cx, cy-s*0.45); ctx.bezierCurveTo(cx+s*0.7, cy-s*1.4, cx+s*1.6, cy-s*0.2, cx, cy+s*0.9); ctx.closePath(); }
function star(ctx, cx, cy, ro, ri){ for (let i = 0; i < 10; i++){ const r = i % 2 ? ri : ro, a = -Math.PI/2 + i*Math.PI/5; i ? ctx.lineTo(cx+r*Math.cos(a), cy+r*Math.sin(a)) : ctx.moveTo(cx+r*Math.cos(a), cy+r*Math.sin(a)); } ctx.closePath(); }
function cover(ctx, img, x, y, w, h){ const s = Math.max(w/img.width, h/img.height), iw = img.width*s, ih = img.height*s; ctx.drawImage(img, x+(w-iw)/2, y+(h-ih)/2, iw, ih); }
function wrapText(ctx, text, maxW){
  const out = [];
  text.split('\n').forEach(par => {
    let line = '';
    for (const ch of par){
      if (!line && ch === ' ') continue;
      if (ctx.measureText(line + ch).width > maxW && line){ out.push(line); line = ch === ' ' ? '' : ch; }
      else line += ch;
    }
    out.push(line);
  });
  return out;
}

/* ---------- background ---------- */
function drawBg(ctx){
  const b = BGS[state.bg.kind];
  if (b.base){
    ctx.fillStyle = b.base; ctx.fillRect(0, 0, W, H);
    if (state.bg.kind === 'check'){
      ctx.fillStyle = 'rgba(240,150,175,0.22)';
      for (let x = 0; x < W; x += 48) ctx.fillRect(x, 0, 24, H);
      for (let y = 0; y < H; y += 48) ctx.fillRect(0, y, W, 24);
    } else if (state.bg.kind === 'cream'){
      ctx.fillStyle = 'rgba(180,130,90,0.16)';
      for (let y = 20, r = 0; y < H; y += 30, r++) for (let x = 14 + (r%2)*15; x < W; x += 30){ ctx.beginPath(); ctx.arc(x, y, 2, 0, 7); ctx.fill(); }
    } else if (state.bg.kind === 'sky'){
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      [[80,150,40],[520,110,32],[500,640,44],[70,700,30]].forEach(([x,y,r]) => { ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.arc(x+r*0.9, y+6, r*0.75, 0, 7); ctx.arc(x-r*0.9, y+8, r*0.65, 0, 7); ctx.fill(); });
    } else if (state.bg.kind === 'choco'){
      ctx.fillStyle = 'rgba(255,190,205,0.18)';
      for (let y = 30, r = 0; y < H; y += 56, r++) for (let x = 24 + (r%2)*28; x < W; x += 56){ ctx.beginPath(); heart(ctx, x, y, 12); ctx.fill(); }
    }
  }
  // soft shadow under the bag
  const g = ctx.createRadialGradient(300, 776, 10, 300, 776, 190);
  g.addColorStop(0, 'rgba(60,20,10,0.22)'); g.addColorStop(1, 'rgba(60,20,10,0)');
  ctx.fillStyle = g; ctx.save(); ctx.scale(1, 0.12); ctx.beginPath(); ctx.arc(300, 776/0.12, 190, 0, 7); ctx.fill(); ctx.restore();

  if (state.bg.stamp){
    ctx.save(); ctx.translate(36, 70); ctx.rotate(-0.07);
    ctx.fillStyle = b.stamp; ctx.textBaseline = 'alphabetic';
    ctx.font = '700 40px Gaegu, cursive'; ctx.fillText('HAPPY 11.11', 0, 0);
    ctx.font = '700 22px Gaegu, cursive'; ctx.fillText('빼빼로데이', 4, 30);
    ctx.beginPath(); heart(ctx, 128, 22, 16); ctx.fill();
    ctx.restore();
  }
}

/* ---------- bag ---------- */
const NX = 300, NY = 238, NW = 26;
function bodyPath(ctx){
  ctx.beginPath();
  ctx.moveTo(NX-NW, NY);
  ctx.bezierCurveTo(NX-NW-14, NY+44, 150, 290, 150, 340);
  ctx.lineTo(150, 742); ctx.quadraticCurveTo(150, 770, 178, 770);
  ctx.lineTo(422, 770); ctx.quadraticCurveTo(450, 770, 450, 742);
  ctx.lineTo(450, 340);
  ctx.bezierCurveTo(450, 290, NX+NW+14, NY+44, NX+NW, NY);
  ctx.closePath();
}
function frillPath(ctx){
  ctx.beginPath();
  ctx.moveTo(NX-NW+2, NY);
  ctx.bezierCurveTo(NX-NW-10, 200, 196, 172, 184, 126);
  const n = 9, x0 = 184, x1 = 416;
  let px = x0;
  for (let i = 1; i <= n; i++){ const x = x0 + (x1-x0)*i/n; ctx.quadraticCurveTo((px+x)/2, 100, x, 126); px = x; }
  ctx.bezierCurveTo(404, 172, NX+NW+10, 200, NX+NW-2, NY);
  ctx.closePath();
}
function drawPattern(ctx, kind, color){
  ctx.save(); ctx.fillStyle = color; ctx.strokeStyle = color; ctx.globalAlpha = 0.72;
  if (kind === 'dots'){ for (let y = 96, r = 0; y < 790; y += 36, r++) for (let x = 132 + (r%2)*18; x < 470; x += 36){ ctx.beginPath(); ctx.arc(x, y, 4.5, 0, 7); ctx.fill(); } }
  else if (kind === 'hearts'){ for (let y = 104, r = 0; y < 790; y += 50, r++) for (let x = 140 + (r%2)*25; x < 470; x += 50){ ctx.beginPath(); heart(ctx, x, y, 14); ctx.fill(); } }
  else if (kind === 'stars'){ for (let y = 104, r = 0; y < 790; y += 48, r++) for (let x = 140 + (r%2)*24; x < 470; x += 48){ ctx.beginPath(); star(ctx, x, y, 7.5, 3.3); ctx.fill(); } }
  else if (kind === 'stripes'){ ctx.globalAlpha = 0.34; ctx.lineWidth = 9; for (let k = -500; k < 700; k += 34){ ctx.beginPath(); ctx.moveTo(k, 800); ctx.lineTo(k+560, 90); ctx.stroke(); } }
  else if (kind === 'check'){ ctx.globalAlpha = 0.2; for (let x = 140; x < 470; x += 40) ctx.fillRect(x, 80, 18, 720); for (let y = 90; y < 800; y += 40) ctx.fillRect(130, y, 340, 18); }
  ctx.restore();
}
function drawBagBack(ctx){
  const t = TINTS[state.bag.tint];
  bodyPath(ctx); ctx.fillStyle = rgba(t.rgb, t.a*0.55); ctx.fill();
  ctx.save(); bodyPath(ctx); ctx.clip();
  const g = ctx.createLinearGradient(150, 0, 450, 0);
  g.addColorStop(0, 'rgba(0,0,0,0.06)'); g.addColorStop(0.5, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.07)');
  ctx.fillStyle = g; ctx.fillRect(140, 200, 320, 580);
  ctx.restore();
}
function drawBagFront(ctx){
  const t = TINTS[state.bag.tint];
  // body
  ctx.save(); bodyPath(ctx); ctx.fillStyle = rgba(t.rgb, t.a); ctx.fill(); ctx.clip();
  drawPattern(ctx, state.bag.pattern, t.pat);
  const g = ctx.createLinearGradient(150, 0, 450, 0);
  g.addColorStop(0, 'rgba(255,255,255,0.6)'); g.addColorStop(0.07, 'rgba(255,255,255,0.08)');
  g.addColorStop(0.5, 'rgba(255,255,255,0)'); g.addColorStop(0.9, 'rgba(255,255,255,0.08)');
  g.addColorStop(0.96, 'rgba(255,255,255,0.45)'); g.addColorStop(1, 'rgba(255,255,255,0.15)');
  ctx.fillStyle = g; ctx.fillRect(140, 200, 320, 580);
  ctx.fillStyle = 'rgba(255,255,255,0.42)';
  ctx.beginPath(); ctx.moveTo(176, 370); ctx.quadraticCurveTo(166, 560, 180, 736); ctx.lineTo(189, 736); ctx.quadraticCurveTo(176, 560, 186, 370); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.beginPath(); ctx.moveTo(420, 380); ctx.quadraticCurveTo(430, 520, 418, 690); ctx.lineTo(424, 690); ctx.quadraticCurveTo(438, 520, 426, 380); ctx.closePath(); ctx.fill();
  // gathered crinkles near the neck
  ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1.3;
  for (let k = -3; k <= 3; k++){ if (!k) continue; ctx.beginPath(); ctx.moveTo(NX + k*6, NY + 6); ctx.quadraticCurveTo(NX + k*18, NY + 40, NX + k*40, NY + 96 + Math.abs(k)*6); ctx.stroke(); }
  ctx.restore();
  bodyPath(ctx); ctx.strokeStyle = 'rgba(120,80,70,0.18)'; ctx.lineWidth = 3; ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 1.6; ctx.stroke();

  // frill above the tie
  ctx.save(); frillPath(ctx); ctx.fillStyle = rgba(t.rgb, Math.min(t.a + 0.1, 0.55)); ctx.fill(); ctx.clip();
  drawPattern(ctx, state.bag.pattern, t.pat);
  ctx.strokeStyle = 'rgba(255,255,255,0.65)'; ctx.lineWidth = 1.3;
  for (let k = -4; k <= 4; k++){ ctx.beginPath(); ctx.moveTo(NX + k*4, NY - 4); ctx.quadraticCurveTo(NX + k*12, 180, NX + k*26, 112); ctx.stroke(); }
  ctx.restore();
  frillPath(ctx); ctx.strokeStyle = 'rgba(120,80,70,0.18)'; ctx.lineWidth = 3; ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 1.6; ctx.stroke();
}

/* ---------- sticks ---------- */
const LAYOUT = [{x:222, rot:-4, h:400}, {x:274, rot:-1.3, h:412}, {x:326, rot:1.3, h:406}, {x:378, rot:4, h:396}];
const BASE_Y = 748;
function shade(ctx, w, y0, y1){
  const g = ctx.createLinearGradient(-w/2, 0, w/2, 0);
  g.addColorStop(0, 'rgba(0,0,0,0.28)'); g.addColorStop(0.28, 'rgba(0,0,0,0)');
  g.addColorStop(0.38, 'rgba(255,255,255,0.32)'); g.addColorStop(0.5, 'rgba(255,255,255,0)');
  g.addColorStop(0.82, 'rgba(0,0,0,0.08)'); g.addColorStop(1, 'rgba(0,0,0,0.32)');
  ctx.fillStyle = g; ctx.fillRect(-w/2 - 2, y0, w + 4, y1 - y0);
}
function drawStick(ctx, s, L, i){
  const w = 46, h = L.h, ch = Math.round(h * 0.66), top = -h, bot = -h + ch, r = w/2;
  const R = rng(i*977 + 13);
  ctx.save(); ctx.translate(L.x, BASE_Y); ctx.rotate(L.rot * Math.PI / 180);

  // biscuit
  const bw = w - 8;
  ctx.save(); ctx.beginPath(); rr(ctx, -bw/2, top + 30, bw, h - 30, 8);
  ctx.fillStyle = BISC[s.biscuit]; ctx.fill(); ctx.clip();
  shade(ctx, bw, top, 0);
  ctx.fillStyle = s.biscuit === 'plain' ? 'rgba(140,80,30,0.35)' : 'rgba(30,15,8,0.4)';
  for (let k = 0; k < 18; k++){ ctx.beginPath(); ctx.arc(-bw/2 + 5 + R()*(bw-10), bot + 8 + R()*(h - ch - 16), 1.2, 0, 7); ctx.fill(); }
  ctx.restore();

  // coating with a drippy lower edge
  ctx.beginPath();
  ctx.moveTo(-r, bot); ctx.lineTo(-r, top + r); ctx.arc(0, top + r, r, Math.PI, 0); ctx.lineTo(r, bot);
  const n = 5;
  for (let k = 1; k <= n; k++){ const x = r - (2*r)*k/n; ctx.quadraticCurveTo(x + r/n, bot + 4 + R()*9, x, bot + (R() - 0.5)*3); }
  ctx.closePath();
  ctx.fillStyle = s.coat; ctx.fill();
  ctx.save(); ctx.clip();
  shade(ctx, w, top, bot + 14);
  drawTopping(ctx, s.top, w, top, bot, R, s.coat);
  if (s.drizzle !== 'none'){
    ctx.strokeStyle = DRIZ[s.drizzle]; ctx.lineWidth = 3.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); let left = true; ctx.moveTo(-r - 2, top + 22);
    for (let y = top + 34; y < bot - 6; y += 15){ ctx.lineTo(left ? r + 2 : -r - 2, y); left = !left; }
    ctx.stroke();
  }
  ctx.restore();

  // letters
  const txt = (s.letter || '').trim();
  if (txt){
    const chars = [...txt].slice(0, 2);
    const fill = state.letter.color === 'auto' ? (lum(s.coat) > 0.62 ? '#5A3424' : '#FFF7EE') : state.letter.color;
    const edge = lum(fill) > 0.6 ? 'rgba(60,30,20,0.55)' : 'rgba(255,255,255,0.75)';
    const size = chars.length > 1 ? 32 : 40;
    ctx.font = `700 ${size}px Gaegu, cursive`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round'; ctx.lineWidth = 5; ctx.strokeStyle = edge; ctx.fillStyle = fill;
    chars.forEach((c, k) => {
      const y = chars.length > 1 ? top + 50 + k*36 : top + ch*0.36;
      ctx.strokeText(c, 0, y); ctx.fillText(c, 0, y);
    });
  }
  ctx.restore();
}
function drawTopping(ctx, kind, w, top, bot, R, coat){
  const x0 = -w/2, span = bot - top - 14, y0 = top + 8;
  const px = () => x0 + 3 + R()*(w - 6), py = () => y0 + R()*span;
  if (kind === 'almond'){
    for (let k = 0; k < 10; k++){
      const cx = px(), cy = py(), rad = 4 + R()*3.5, pts = 5;
      ctx.beginPath();
      for (let p = 0; p < pts; p++){ const a = p/pts*Math.PI*2 + R(), rr2 = rad*(0.7 + R()*0.5); p ? ctx.lineTo(cx + Math.cos(a)*rr2, cy + Math.sin(a)*rr2) : ctx.moveTo(cx + Math.cos(a)*rr2, cy + Math.sin(a)*rr2); }
      ctx.closePath(); ctx.fillStyle = '#EAC99A'; ctx.fill(); ctx.strokeStyle = '#B5864F'; ctx.lineWidth = 0.9; ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.beginPath(); ctx.arc(cx - 1, cy - 1, 1.3, 0, 7); ctx.fill();
    }
  } else if (kind === 'sprinkle'){
    const cols = ['#FF5C8A','#FFD23F','#3BCEAC','#5E9BFF','#FFFFFF','#B76CFD'];
    for (let k = 0; k < 30; k++){
      ctx.save(); ctx.translate(px(), py()); ctx.rotate(R()*Math.PI);
      ctx.fillStyle = cols[k % cols.length]; ctx.beginPath(); rr(ctx, -1.6, -4.5, 3.2, 9, 1.6); ctx.fill(); ctx.restore();
    }
  } else if (kind === 'cookie'){
    for (let k = 0; k < 26; k++){
      const cx = px(), cy = py(), rad = 1.4 + R()*3;
      ctx.fillStyle = k % 6 === 0 ? '#F4ECE0' : '#2A1A13';
      ctx.beginPath(); ctx.moveTo(cx + rad, cy); ctx.lineTo(cx, cy + rad*0.8); ctx.lineTo(cx - rad, cy + rad*0.2); ctx.lineTo(cx - rad*0.3, cy - rad); ctx.closePath(); ctx.fill();
    }
  } else if (kind === 'heart'){
    const cols = ['#FF4D7A','#FFFFFF','#FF9EB8','#D7263D'];
    for (let k = 0; k < 13; k++){ ctx.fillStyle = cols[k % 4]; ctx.beginPath(); heart(ctx, px(), py(), 6 + R()*3); ctx.fill(); }
  } else if (kind === 'star'){
    const cols = ['#FFD23F','#FFFFFF','#F2B93B'];
    for (let k = 0; k < 13; k++){ ctx.fillStyle = cols[k % 3]; ctx.beginPath(); star(ctx, px(), py(), 4 + R()*1.5, 1.8); ctx.fill(); }
  } else if (kind === 'coconut'){
    ctx.strokeStyle = lum(coat) > 0.75 ? '#E9DCC9' : '#FFFDF8'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
    for (let k = 0; k < 34; k++){ const cx = px(), cy = py(), a = R()*Math.PI; ctx.beginPath(); ctx.moveTo(cx - Math.cos(a)*3, cy - Math.sin(a)*3); ctx.lineTo(cx + Math.cos(a)*3, cy + Math.sin(a)*3); ctx.stroke(); }
  }
}

/* ---------- ribbon ---------- */
function drawRibbon(ctx){
  const c = state.ribbon.color, dark = mix(c, -0.28), lite = mix(c, 0.35);
  const edge = lum(c) > 0.85 ? 'rgba(120,90,80,0.55)' : dark;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  const x = NX, y = NY;

  if (state.ribbon.style === 'bow'){
    const tail = (sgn, len) => {
      ctx.beginPath();
      ctx.moveTo(x - sgn*6, y);
      ctx.quadraticCurveTo(x - sgn*24, y + len*0.5, x - sgn*58, y + len);
      ctx.lineTo(x - sgn*42, y + len - 10);
      ctx.lineTo(x - sgn*34, y + len + 8);
      ctx.quadraticCurveTo(x - sgn*6, y + len*0.55, x + sgn*8, y + 6);
      ctx.closePath(); ctx.fillStyle = c; ctx.fill(); ctx.strokeStyle = edge; ctx.lineWidth = 1.6; ctx.stroke();
    };
    tail(1, 92); tail(-1, 80);
    ctx.beginPath(); rr(ctx, x - NW - 6, y - 7, (NW + 6)*2, 14, 5); ctx.fillStyle = c; ctx.fill(); ctx.strokeStyle = edge; ctx.lineWidth = 1.4; ctx.stroke();
    const loop = sgn => {
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.bezierCurveTo(x + sgn*36, y - 62, x + sgn*100, y - 46, x + sgn*86, y - 2);
      ctx.bezierCurveTo(x + sgn*76, y + 32, x + sgn*34, y + 18, x, y);
      ctx.closePath(); ctx.fillStyle = c; ctx.fill(); ctx.strokeStyle = edge; ctx.lineWidth = 1.8; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x + sgn*10, y - 2); ctx.bezierCurveTo(x + sgn*36, y - 30, x + sgn*62, y - 26, x + sgn*66, y - 6);
      ctx.strokeStyle = dark; ctx.globalAlpha = 0.45; ctx.lineWidth = 6; ctx.stroke(); ctx.globalAlpha = 1;
      ctx.beginPath(); ctx.moveTo(x + sgn*30, y - 34); ctx.quadraticCurveTo(x + sgn*56, y - 44, x + sgn*76, y - 28);
      ctx.strokeStyle = lite; ctx.globalAlpha = 0.8; ctx.lineWidth = 3; ctx.stroke(); ctx.globalAlpha = 1;
    };
    loop(-1); loop(1);
    ctx.beginPath(); rr(ctx, x - 14, y - 13, 28, 26, 9); ctx.fillStyle = c; ctx.fill(); ctx.strokeStyle = edge; ctx.lineWidth = 1.8; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - 6, y - 7); ctx.lineTo(x + 3, y - 7); ctx.strokeStyle = lite; ctx.lineWidth = 3; ctx.stroke();
  } else if (state.ribbon.style === 'string'){
    ctx.strokeStyle = c; ctx.lineWidth = 5;
    ctx.beginPath(); rr(ctx, x - NW - 3, y - 4, (NW + 3)*2, 8, 4); ctx.stroke();
    const loop = sgn => { ctx.save(); ctx.translate(x + sgn*24, y - 14); ctx.rotate(sgn*-0.5); ctx.beginPath(); ctx.ellipse(0, 0, 26, 13, 0, 0, 7); ctx.restore(); ctx.strokeStyle = c; ctx.lineWidth = 5; ctx.stroke(); };
    loop(-1); loop(1);
    [[-1, 110], [1, 96]].forEach(([sgn, len]) => {
      ctx.beginPath(); ctx.moveTo(x, y);
      for (let t = 0; t <= 1.001; t += 0.05){ const yy = y + t*len, xx = x + sgn*(10 + t*30) + Math.sin(t*Math.PI*5)*10*(0.4 + t); ctx.lineTo(xx, yy); }
      ctx.strokeStyle = c; ctx.lineWidth = 4; ctx.stroke();
    });
    ctx.beginPath(); ctx.arc(x, y, 7, 0, 7); ctx.fillStyle = c; ctx.fill();
    if (lum(c) > 0.85){ ctx.strokeStyle = 'rgba(120,90,80,0.5)'; ctx.lineWidth = 1; ctx.stroke(); }
  } else {
    // twist tie
    const wire = (pts) => {
      ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); ctx.bezierCurveTo(pts[2], pts[3], pts[4], pts[5], pts[6], pts[7]);
      ctx.strokeStyle = edge; ctx.lineWidth = 9; ctx.stroke();
      ctx.strokeStyle = c; ctx.lineWidth = 7; ctx.stroke();
      ctx.setLineDash([3, 5]); ctx.strokeStyle = lite; ctx.lineWidth = 7; ctx.stroke(); ctx.setLineDash([]);
    };
    wire([x - NW - 4, y, x - 10, y + 8, x + 10, y + 8, x + NW + 4, y]);
    wire([x - 6, y + 2, x - 30, y - 20, x - 60, y - 34, x - 84, y - 58]);
    wire([x + 6, y + 2, x + 34, y - 10, x + 64, y - 26, x + 92, y - 40]);
  }
}

/* ---------- tag ---------- */
const TAG = {x:426, y:300, rot:7*Math.PI/180, w:136, h:172};
function drawTag(ctx){
  if (!state.tag.show) return;
  const {x, y, rot, w, h} = TAG, cos = Math.cos(rot), sin = Math.sin(rot);
  const hx = x + cos*(w/2) - sin*18, hy = y + sin*(w/2) + cos*18;
  ctx.beginPath(); ctx.moveTo(NX + 8, NY + 6); ctx.quadraticCurveTo(372, 300, hx, hy);
  ctx.strokeStyle = '#B98F64'; ctx.lineWidth = 2; ctx.stroke();

  const col = state.tag.color, ink = lum(col) > 0.55 ? '#5A3424' : '#FFF5EE';
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.shadowColor = 'rgba(60,25,15,0.22)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 4;
  ctx.beginPath(); ctx.moveTo(22, 0); ctx.lineTo(w - 22, 0); ctx.lineTo(w, 22); ctx.lineTo(w, h - 8); ctx.arcTo(w, h, w - 8, h, 8);
  ctx.lineTo(8, h); ctx.arcTo(0, h, 0, h - 8, 8); ctx.lineTo(0, 22); ctx.closePath();
  ctx.fillStyle = col; ctx.fill();
  ctx.shadowColor = 'transparent';
  if (lum(col) > 0.9){ ctx.strokeStyle = 'rgba(150,110,90,0.25)'; ctx.lineWidth = 1; ctx.stroke(); }
  ctx.beginPath(); ctx.arc(w/2, 18, 6.5, 0, 7); ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fill();
  ctx.beginPath(); ctx.arc(w/2, 18, 6.5, 0, 7); ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 2; ctx.stroke();

  ctx.fillStyle = ink; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  ctx.font = '700 20px Gaegu, cursive'; ctx.fillText('To. ' + (state.tag.to || ''), 12, 50);
  ctx.font = '400 20px Gaegu, cursive';
  const lines = wrapText(ctx, state.tag.msg || '', w - 24).slice(0, 4);
  lines.forEach((ln, k) => ctx.fillText(ln, 12, 78 + k*21));
  ctx.font = '700 18px Gaegu, cursive'; ctx.textAlign = 'right';
  ctx.fillText('From. ' + (state.tag.from || ''), w - 12, h - 14);
  ctx.restore();
}

/* ---------- photo ---------- */
function drawPhoto(ctx){
  const p = state.photo; if (!p || !photoImg) return;
  const s = p.size;
  ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot * Math.PI / 180);
  ctx.shadowColor = 'rgba(50,20,10,0.28)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 5;
  if (p.frame === 'polaroid'){
    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(-s/2 - 10, -s/2 - 10, s + 20, s + 50);
    ctx.shadowColor = 'transparent';
    ctx.save(); ctx.beginPath(); ctx.rect(-s/2, -s/2, s, s); ctx.clip(); cover(ctx, photoImg, -s/2, -s/2, s, s); ctx.restore();
    if (p.caption){ ctx.fillStyle = '#5A3424'; ctx.font = `700 ${Math.max(16, s*0.13)}px Gaegu, cursive`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(p.caption, 0, s/2 + 20); }
    ctx.save(); ctx.rotate(-0.12); ctx.fillStyle = 'rgba(255,214,224,0.78)'; ctx.fillRect(-26, -s/2 - 22, 52, 22); ctx.restore();
  } else if (p.frame === 'heart'){
    ctx.beginPath(); heart(ctx, 0, s*0.08, s*1.16); ctx.fillStyle = '#FFFFFF'; ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.save(); ctx.beginPath(); heart(ctx, 0, s*0.08, s); ctx.clip(); cover(ctx, photoImg, -s*0.55, -s*0.55, s*1.1, s*1.1); ctx.restore();
  } else {
    ctx.beginPath(); ctx.arc(0, 0, s/2 + 9, 0, 7); ctx.fillStyle = '#FFFFFF'; ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.save(); ctx.beginPath(); ctx.arc(0, 0, s/2, 0, 7); ctx.clip(); cover(ctx, photoImg, -s/2, -s/2, s, s); ctx.restore();
    ctx.beginPath(); ctx.arc(0, 0, s/2 + 4.5, 0, 7); ctx.setLineDash([5, 6]); ctx.strokeStyle = '#FF8FAB'; ctx.lineWidth = 2; ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.restore();
}

/* ---------- compose ---------- */
function draw(ctx){
  ctx.save(); ctx.clearRect(0, 0, W, H);
  drawBg(ctx);
  drawBagBack(ctx);
  state.sticks.forEach((s, i) => drawStick(ctx, s, LAYOUT[i], i));
  drawBagFront(ctx);
  drawTag(ctx);
  drawRibbon(ctx);
  drawPhoto(ctx);
  ctx.restore();
}

const cv = document.getElementById('cv'), cx = cv.getContext('2d');
function sizeCanvas(){ const d = Math.min(window.devicePixelRatio || 1, 2.5); cv.width = W*d; cv.height = H*d; cx.setTransform(d, 0, 0, d, 0, 0); render(); }
let raf = 0;
function render(){ if (raf) return; raf = requestAnimationFrame(() => { raf = 0; draw(cx); }); }

/* ---------- UI ---------- */
const $ = id => document.getElementById(id);
function getVal(path){
  const [a, b] = path.split('.');
  if (a === 'stick') return state.sticks[sel === 'all' ? 0 : sel][b];
  if (a === 'photo') return state.photo ? state.photo[b] : undefined;
  return state[a][b];
}
function setVal(path, v){
  const [a, b] = path.split('.');
  if (a === 'stick') (sel === 'all' ? state.sticks : [state.sticks[sel]]).forEach(s => s[b] = v);
  else if (a === 'photo'){ if (state.photo) state.photo[b] = v; }
  else state[a][b] = v;
  commit();
}
let saveT = 0;
function persist(){
  clearTimeout(saveT);
  saveT = setTimeout(() => { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {
    try { localStorage.setItem(STORE, JSON.stringify(Object.assign({}, state, {photo:null}))); } catch (e2) {} } }, 300);
}
function commit(){ render(); syncUI(); persist(); }

function buildControls(){
  document.querySelectorAll('[data-opts]').forEach(box => {
    const opts = OPTS[box.dataset.opts], isSw = box.classList.contains('swatches');
    opts.forEach(([val, name]) => {
      const b = document.createElement('button');
      b.type = 'button'; b.dataset.val = val;
      if (isSw){ b.className = 'sw'; b.style.background = val; b.title = name; b.setAttribute('aria-label', name); }
      else { b.className = 'chip'; b.textContent = name; }
      b.addEventListener('click', () => setVal(box.dataset.path, val));
      box.appendChild(b);
    });
    if (box.dataset.custom){
      const l = document.createElement('label'); l.className = 'sw custom'; l.title = '직접 고르기';
      const inp = document.createElement('input'); inp.type = 'color'; inp.setAttribute('aria-label', '색 직접 고르기');
      inp.addEventListener('input', () => setVal(box.dataset.path, inp.value));
      l.appendChild(inp); box.appendChild(l);
    }
  });
  const picker = $('picker');
  state.sticks.forEach((_, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'stick-btn'; b.dataset.i = i;
    b.innerHTML = `<span class="mini"></span>${i + 1}번`;
    b.addEventListener('click', () => { sel = i; syncUI(); });
    picker.appendChild(b);
  });
  const all = document.createElement('button'); all.type = 'button'; all.className = 'stick-btn all-btn'; all.dataset.i = 'all';
  all.innerHTML = '<span style="font-size:20px;line-height:46px">✦</span>모두';
  all.addEventListener('click', () => { sel = 'all'; syncUI(); });
  picker.appendChild(all);

  document.querySelectorAll('input[data-path], textarea[data-path]').forEach(inp => {
    inp.addEventListener('input', () => setVal(inp.dataset.path, inp.type === 'range' ? +inp.value : inp.value));
  });
  document.querySelectorAll('[data-letter]').forEach(inp => {
    inp.addEventListener('input', () => { state.sticks[+inp.dataset.letter].letter = inp.value; commit(); });
  });
  $('stampToggle').addEventListener('change', e => setVal('bg.stamp', e.target.checked));
  $('tagToggle').addEventListener('change', e => setVal('tag.show', e.target.checked));
}

function syncUI(){
  document.querySelectorAll('[data-opts]').forEach(box => {
    const cur = String(getVal(box.dataset.path)).toLowerCase();
    let hit = false;
    box.querySelectorAll('button').forEach(b => { const on = b.dataset.val.toLowerCase() === cur; hit = hit || on; b.setAttribute('aria-pressed', on); });
    const custom = box.querySelector('.sw.custom');
    if (custom){ custom.setAttribute('aria-pressed', !hit); if (cur.startsWith('#') && cur.length === 7) custom.querySelector('input').value = cur; }
  });
  document.querySelectorAll('.stick-btn').forEach(b => {
    b.setAttribute('aria-pressed', String(b.dataset.i) === String(sel));
    const s = state.sticks[+b.dataset.i];
    if (s){ const m = b.querySelector('.mini'); m.style.background = `linear-gradient(to bottom, ${s.coat} 0 64%, ${BISC[s.biscuit]} 64%)`; m.style.boxShadow = 'inset 0 0 0 1px rgba(0,0,0,.12)'; }
  });
  $('selLabel').textContent = sel === 'all' ? '4개 모두 한꺼번에' : `${sel + 1}번 과자`;
  document.querySelectorAll('input[data-path], textarea[data-path]').forEach(inp => {
    if (document.activeElement === inp) return;
    const v = getVal(inp.dataset.path); inp.value = v == null ? '' : v;
  });
  document.querySelectorAll('[data-letter]').forEach(inp => { if (document.activeElement !== inp) inp.value = state.sticks[+inp.dataset.letter].letter || ''; });
  $('stampToggle').checked = state.bg.stamp;
  $('tagToggle').checked = state.tag.show;
  ['tagTo', 'tagFrom', 'tagMsg'].forEach(id => $(id).disabled = !state.tag.show);
  const hasPhoto = !!state.photo;
  $('photoCtrls').hidden = !hasPhoto;
  $('uploadBox').querySelector('label').textContent = hasPhoto ? '다른 사진으로 바꾸기' : '사진 고르기';
  cv.style.touchAction = hasPhoto ? 'none' : 'auto';
}

/* tabs */
const tabs = [...document.querySelectorAll('.tab')];
tabs.forEach(t => t.addEventListener('click', () => {
  tabs.forEach(o => { const on = o === t; o.setAttribute('aria-selected', on); $(o.getAttribute('aria-controls')).hidden = !on; });
}));

/* photo loading */
function loadPhotoSrc(src, done){ const img = new Image(); img.onload = () => { photoImg = img; done && done(); render(); }; img.src = src; }
function takeFile(file){
  if (!file || !file.type.startsWith('image/')){ note('이미지 파일만 넣을 수 있어요.'); return; }
  const fr = new FileReader();
  fr.onload = () => {
    const img = new Image();
    img.onload = () => {
      const m = 900, k = Math.min(1, m / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const src = c.toDataURL('image/jpeg', 0.88);
      const prev = state.photo;
      state.photo = {src, x: prev ? prev.x : 210, y: prev ? prev.y : 590, size: prev ? prev.size : 150, rot: prev ? prev.rot : -6, frame: prev ? prev.frame : 'polaroid', caption: prev ? prev.caption : '2026.11.11'};
      loadPhotoSrc(src, commit);
      note('사진을 붙였어요. 미리보기에서 끌어서 옮겨 보세요.');
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}
$('fileIn').addEventListener('change', e => { takeFile(e.target.files[0]); e.target.value = ''; });
$('photoDel').addEventListener('click', () => { state.photo = null; photoImg = null; commit(); note('사진을 뺐어요.'); });
const stage = $('stage');
stage.addEventListener('dragover', e => { e.preventDefault(); $('dropHint').hidden = false; });
stage.addEventListener('dragleave', e => { if (!stage.contains(e.relatedTarget)) $('dropHint').hidden = true; });
stage.addEventListener('drop', e => { e.preventDefault(); $('dropHint').hidden = true; takeFile(e.dataTransfer.files[0]); });

/* dragging the photo */
let drag = null;
function pt(e){ const r = cv.getBoundingClientRect(); return {x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height}; }
function overPhoto(p){ const ph = state.photo; if (!ph) return false; const r = ph.size*0.6 + 14; return Math.abs(p.x - ph.x) < r && p.y > ph.y - r && p.y < ph.y + r + 30; }
cv.addEventListener('pointerdown', e => {
  const p = pt(e); if (!overPhoto(p)) return;
  drag = {dx: p.x - state.photo.x, dy: p.y - state.photo.y};
  cv.setPointerCapture(e.pointerId); cv.classList.add('dragging'); e.preventDefault();
});
cv.addEventListener('pointermove', e => {
  const p = pt(e);
  if (drag){ state.photo.x = Math.max(0, Math.min(W, p.x - drag.dx)); state.photo.y = Math.max(0, Math.min(H, p.y - drag.dy)); render(); }
  else cv.classList.toggle('grab', overPhoto(p));
});
const endDrag = () => { if (drag){ drag = null; cv.classList.remove('dragging'); persist(); } };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

/* actions */
let noteT = 0;
function note(msg){ $('note').textContent = msg; clearTimeout(noteT); noteT = setTimeout(() => $('note').textContent = '', 4000); }
const pick = a => a[Math.floor(Math.random()*a.length)];
$('randomBtn').addEventListener('click', () => {
  state.sticks.forEach(s => {
    s.coat = pick(COATS)[0]; s.biscuit = Math.random() < 0.75 ? 'plain' : 'choco';
    s.top = pick(OPTS.top)[0]; s.drizzle = Math.random() < 0.5 ? 'none' : pick(OPTS.drizzle.slice(1))[0];
  });
  state.bag.tint = pick(OPTS.tint)[0]; state.bag.pattern = pick(OPTS.pattern)[0];
  state.ribbon.style = pick(OPTS.rstyle)[0]; state.ribbon.color = pick(OPTS.rcolor)[0];
  commit();
});
let resetArmed = false;
$('resetBtn').addEventListener('click', () => {
  if (!resetArmed){ resetArmed = true; $('resetBtn').textContent = '한 번 더 누르면 초기화'; setTimeout(() => { resetArmed = false; $('resetBtn').textContent = '처음부터'; }, 3000); return; }
  resetArmed = false; $('resetBtn').textContent = '처음부터';
  state = defaults(); photoImg = null; sel = 0; commit(); note('처음 상태로 돌아왔어요.');
});

const dlP = (async () => { try { return (window.claude && window.claude.use) ? await window.claude.use('downloads') : null; } catch (e) { return null; } })();
$('saveBtn').addEventListener('click', async () => {
  const off = document.createElement('canvas'); off.width = W*2; off.height = H*2;
  const o = off.getContext('2d'); o.scale(2, 2); draw(o);
  const blob = await new Promise(r => off.toBlob(r, 'image/png'));
  const dl = await Promise.race([dlP, new Promise(r => setTimeout(() => r(null), 1500))]);
  if (dl){
    try { await dl.save({filename: '빼빼로-선물.png', data: blob}); note('이미지를 저장했어요.'); return; }
    catch (e){
      if (e && e.code === 'declined'){ note('저장을 취소했어요.'); return; }
      if (e && e.code === 'rate_limited'){ note('저장 창이 이미 열려 있어요. 잠시 후 다시 눌러 주세요.'); return; }
    }
  }
  if (!window.claude){
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '빼빼로-선물.png';
    document.body.appendChild(a); a.click(); a.remove(); note('이미지를 저장했어요.'); return;
  }
  $('sheetImg').src = URL.createObjectURL(blob); $('sheet').hidden = false;
});
$('sheetClose').addEventListener('click', () => $('sheet').hidden = true);
$('sheet').addEventListener('click', e => { if (e.target === $('sheet')) $('sheet').hidden = true; });

/* D-day */
(function(){
  const now = new Date(), y = now.getMonth() > 10 || (now.getMonth() === 10 && now.getDate() > 11) ? now.getFullYear() + 1 : now.getFullYear();
  const d = Math.round((new Date(y, 10, 11) - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000);
  $('dday').textContent = d === 0 ? '오늘이 빼빼로데이!' : `빼빼로데이까지 D-${d}`;
})();

buildControls();
if (state.photo && state.photo.src) loadPhotoSrc(state.photo.src);
syncUI();
sizeCanvas();
window.addEventListener('resize', () => { const d = Math.min(window.devicePixelRatio || 1, 2.5); if (cv.width !== W*d) sizeCanvas(); });
if (document.fonts){ document.fonts.load('700 40px Gaegu').then(render, () => {}); document.fonts.load('400 20px Gaegu').then(render, () => {}); document.fonts.ready.then(render); }
</script>
